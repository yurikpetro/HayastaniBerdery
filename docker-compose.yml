services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hayastani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hayastani
      POSTGRES_PASSWORD: hayastani
      POSTGRES_DB: hayastani
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hayastani -d hayastani']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hayastani-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9100:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/hayastani-media || true;
      mc anonymous set download local/hayastani-media;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
